name: .NET Desktop CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish ./owoow.WinForms/owoow.WinForms.csproj -c Release -r win-x64 --self-contained false -p:Platform=x64 -o "$env:RUNNER_TEMP/owoow-publish"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload CI build
        uses: actions/upload-artifact@v4
        with:
          name: owoow-win-x64-ci
          path: ${{ runner.temp }}/owoow-publish/
          if-no-files-found: error
